# Selbst hosten mit Docker – siehe README.md, Abschnitt „Selbst hosten“
#
#   Start:   docker compose up -d --build     → http://localhost:2222
#   Status:  docker compose ps                (Spalte STATUS zeigt "healthy")
#   Logs:    docker compose logs -f
#   Stopp:   docker compose down
services:
  eduroam:
    build: .
    image: eduroam-simulator:local
    container_name: eduroam-simulator
    restart: unless-stopped
    init: true
    environment:
      PORT: "2222"
      # LOG_REQUESTS: "1"   # jede Anfrage protokollieren (für die Fehlersuche)
    ports:
      # Bind-Adresse und Host-Port lassen sich per .env ändern (EDUROAM_BIND, EDUROAM_PORT).
      # Standard: alle Schnittstellen, Port 2222.
      - "${EDUROAM_BIND:-0.0.0.0}:${EDUROAM_PORT:-2222}:2222"
    # Härtung: Dateisystem schreibgeschützt, keine Linux-Capabilities, keine Rechteausweitung
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
